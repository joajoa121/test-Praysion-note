<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="assets/local-icons.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>


<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="application-name" content="Praysion Note"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Praysion Note"/>
<meta name="format-detection" content="telephone=no"/>
<title>이룸기도 | Praysion Note</title>
<link rel="stylesheet" href="assets/app.css"/>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
</head><body>
<div id="frame" class="page-list">
  <!-- 스플래시 -->
  <div id="splash" class="hidden">
    <div class="intro-brand intro-brand-splash">
      <div class="intro-brand-icon"><i class="ti ti-pray"></i></div>
      <div class="intro-brand-title">이룸기도</div>
      <div class="intro-brand-chip">Praysion Note</div>
    </div>
  </div>

  <div id="lock">
    <button type="button" id="lock-back-btn" aria-label="뒤로가기" class="lock-back-btn"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
    <div class="intro-brand intro-brand-lock">
      <div class="intro-brand-icon"><i class="ti ti-pray"></i></div>
      <div class="intro-brand-title">이룸기도</div>
      <div class="intro-brand-chip">Praysion Note</div>
    </div>
    <div class="lock-sub" id="lock-sub" role="heading" aria-level="2" tabindex="-1">핀을 입력하세요</div>
    <div class="pin-dots" aria-hidden="true">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div id="pin-progress" class="sr-only" role="status" aria-live="polite"></div>
    <div class="pin-error" id="pin-err" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <div class="keypad" role="group" aria-label="PIN 키패드">
      <button type="button" class="key" data-pin-digit="1" aria-label="1">1</button><button type="button" class="key" data-pin-digit="2" aria-label="2">2</button><button type="button" class="key" data-pin-digit="3" aria-label="3">3</button>
      <button type="button" class="key" data-pin-digit="4" aria-label="4">4</button><button type="button" class="key" data-pin-digit="5" aria-label="5">5</button><button type="button" class="key" data-pin-digit="6" aria-label="6">6</button>
      <button type="button" class="key" data-pin-digit="7" aria-label="7">7</button><button type="button" class="key" data-pin-digit="8" aria-label="8">8</button><button type="button" class="key" data-pin-digit="9" aria-label="9">9</button>
      <button type="button" class="key key-placeholder" aria-hidden="true" tabindex="-1" disabled></button><button type="button" class="key" data-pin-digit="0" aria-label="0">0</button>
      <button type="button" class="key del" id="pin-delete-btn" aria-label="한 자리 삭제">⌫</button>
    </div>
    <div class="lock-hint" id="lock-hint"></div>
  </div>

  <div id="topbar">
    <button class="top-icon-btn topbar-back-btn" id="topbar-back" aria-label="뒤로가기" data-i18n-aria-label="backLabel"><i class="ti ti-arrow-left"></i></button>
    <h1 id="topbar-title">기도목록</h1>
    <div id="topbar-actions"></div>
  </div>
  <div class="view" id="view-list">
    <div id="search-wrap">
      <div class="search-box">
        <span id="search-icon" class="search-icon"><i class="ti ti-search"></i></span>
        <input id="search-input" type="text" placeholder="제목 및 내용 검색" data-i18n-placeholder="search" />
        <button id="search-clear"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div id="tab-bar"></div>
    <div id="slide-container"><div id="slides-wrapper"></div></div>
  </div>


  <!-- 새 기도제목 입력 -->
  <div class="view" id="view-new">

    <div id="new-form">
      <section class="prayer-editor" aria-label="기도 작성">
        <div class="prayer-editor-category">
          <div class="cat-select-wrap" id="new-cat-chips"></div>
        </div>
        <div class="prayer-editor-title">
          <textarea id="new-title" class="prayer-title-input" placeholder="기도제목을 입력하세요." data-i18n-placeholder="newTitle" rows="1"></textarea>
        </div>
        <div class="prayer-editor-body">
          <textarea id="new-body" class="prayer-body-input" placeholder="기도내용을 자유롭게 입력하세요." data-i18n-placeholder="newBody"></textarea>
        </div>
      </section>
    </div>
    <div class="restore-btn-wrap">
      <button type="button" id="new-submit-btn" class="restore-btn new-submit-btn" data-new-prayer-action="submit" data-i18n="add" data-i18n-aria-label="newPrayerSubmitLabel" aria-label="새 기도제목 등록">등록</button>
    </div>
  </div>


  <div class="view" id="view-archive">

    <div id="archive-search-wrap">
      <div class="search-box">
        <span class="search-icon"><i class="ti ti-search"></i></span>
        <input id="archive-search-input" type="text" placeholder="제목 및 내용 검색" data-i18n-placeholder="search"/>
      </div>
    </div>
    <div id="archive-tab-bar"></div>
    <div id="archive-slide-container">
      <div id="archive-slides-wrapper"></div>
    </div>
  </div>


  <div class="view" id="view-detail">

    <div id="detail-scroll">
      <section class="prayer-editor" aria-label="기도 상세">
        <div id="detail-cat-wrap" class="prayer-editor-category"></div>
        <div id="detail-title-wrap" class="prayer-editor-title">
          <textarea id="detail-title-input" class="prayer-title-input" placeholder="기도제목을 입력하세요." rows="1"></textarea>
        </div>
        <div id="detail-body-wrap" class="prayer-editor-body">
          <textarea id="detail-body-input" class="detail-body-input" rows="1" placeholder="기도 내용을 입력하세요."></textarea>
          <div id="detail-created-at" class="detail-created-at"></div>
        </div>
      </section>
      <div id="memo-list"></div>
    </div>
    <div id="memo-add-area">
      <div>
        <textarea id="memo-add-ta" placeholder="감사 내용을 기록해보세요." data-i18n-placeholder="thanksPH" rows="1"></textarea>
        <div class="memo-add-actions">
          <button class="memo-add-btn thanks" type="button" data-detail-action="add-thanks" data-i18n="gratitudeRecord">감사 기록하기</button>
        </div>
      </div>
    </div>
  </div>


  <div class="view" id="view-cat">

    <div id="cat-view">
      <div class="cat-add-row"><input id="cat-add-inp" type="text" placeholder="새 카테고리 추가" data-i18n-placeholder="newCat"/><button id="cat-add-btn" type="button" data-category-action="add" aria-label="카테고리 추가" data-i18n-aria-label="addCategoryLabel">+</button></div>
      <div id="cat-rows"></div>
    </div>
  </div>

  <div class="view" id="view-backup">

    <div class="backup-view">
      <div class="backup-section-label" id="backup-section-export" data-i18n="backupSectionExport">백업</div>
      <div class="backup-card">
        <div class="backup-card-title"><i class="ti ti-download"></i><span id="backup-save-title" data-i18n="backupSaveTitle">백업 파일 저장</span></div>
        <div class="backup-card-desc" id="backup-save-desc" data-i18n="backupSaveDesc">현재 기도제목, 카테고리, 메모를 JSON 파일로 저장합니다.</div>
        <button class="backup-btn" id="backup-export-btn" type="button" data-i18n="backupExportBtn">JSON 백업 내보내기</button>
      </div>

      <div class="backup-section-label" id="backup-section-import" data-i18n="backupSectionImport">가져오기</div>
      <div class="backup-card">
        <div class="backup-card-title"><i class="ti ti-upload"></i><span id="backup-json-title" data-i18n="backupJsonTitle">JSON 백업 가져오기</span></div>
        <div class="backup-card-desc" id="backup-json-desc" data-i18n="backupJsonDesc">이 앱에서 저장한 백업 파일을 불러와 현재 데이터에 추가합니다.</div>
        <button class="backup-btn sub" id="backup-json-import-btn" type="button" data-import-trigger data-i18n="backupJsonBtn">JSON 파일 선택</button>
      </div>

      <div class="backup-card">
        <div class="backup-card-title"><i class="ti ti-file-spreadsheet"></i><span id="backup-excel-title" data-i18n="backupExcelTitle">Excel 가져오기</span></div>
        <div class="backup-card-desc" id="backup-excel-desc" data-i18n="backupExcelDesc">정해진 양식의 Excel 파일을 불러와 기도제목과 여러 메모를 한 번에 추가합니다.</div>
        <button class="backup-btn sub" id="backup-excel-template-btn" type="button" data-i18n="backupTemplateBtn">Excel 양식 다운로드</button>
        <button class="backup-btn" id="backup-excel-import-btn" type="button" data-import-trigger data-i18n="backupExcelBtn">Excel 파일 선택</button>
      </div>
    </div>
  </div>

  <div id="bottom-nav">
    <div class="nav-bar">
      <button class="nav-btn active" id="nav-list" data-nav-view="list"><i class="ti ti-notes"></i><span data-i18n="navList">기도함</span></button>
      <button class="nav-btn" id="nav-archive" data-nav-view="archive"><i class="ti ti-heart"></i><span data-i18n="navArchive">응답함</span></button>
      <button class="nav-btn" id="nav-settings"><i class="ti ti-settings"></i><span data-i18n="navSettings">설정</span></button>
    </div>
    <button id="fab"><i class="ti ti-plus"></i></button>
  </div>


  <!-- 토스트 메시지 -->
  <div id="app-toast" class="app-toast toast-hidden"></div>

  <!-- 커스텀 팝업 -->
  <div id="custom-modal" class="custom-modal hidden">
    <div class="custom-modal-box">
      <div class="custom-modal-title" id="custom-modal-title"></div>
      <div class="custom-modal-message" id="custom-modal-message"></div>
      <div class="custom-modal-actions" id="custom-modal-actions">
        <button class="custom-modal-btn cancel" id="custom-modal-cancel"></button>
        <button class="custom-modal-btn ok" id="custom-modal-ok"></button>
      </div>
    </div>
  </div>

  <!-- 설정 바텀시트 -->
  <div id="settings-overlay">
    <div id="settings-sheet">
      <div class="settings-handle"></div>
      <div class="settings-title" data-i18n="security">보안 설정</div>
      <div class="settings-item">
        <span class="settings-item-icon"><i class="ti ti-shield-lock"></i></span>
        <span class="settings-item-label" id="lock-toggle-label" data-i18n="appLock">앱 잠금</span>
        <span id="lock-toggle-sub" class="lock-toggle-sub">잠금 비활성화</span>
        <label class="toggle-switch">
          <input type="checkbox" id="lock-toggle" aria-labelledby="lock-toggle-label lock-toggle-sub"/>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <button type="button" class="settings-item is-hidden" id="change-pin-item">
        <span class="settings-item-icon"><i class="ti ti-key"></i></span>
        <span class="settings-item-label" data-i18n="changePin">비밀번호 변경</span>
        <span class="settings-item-arrow"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      </button>
      <div class="settings-title settings-title-spaced" data-i18n="catSettings">카테고리 설정</div>
      <div class="settings-item" data-settings-menu="cat">
        <span class="settings-item-icon"><i class="ti ti-category"></i></span>
        <span class="settings-item-label" data-i18n="catManage">카테고리 관리</span>
        <span class="settings-item-arrow"><i class="ti ti-chevron-right"></i></span>
      </div>
      <div class="settings-title settings-title-spaced" data-i18n="langSettings">언어 설정</div>

      <div class="settings-item" data-lang-option="ko">
        <span class="settings-item-icon"><i class="ti ti-lang-ko" aria-hidden="true"></i></span>
        <span class="settings-item-label">한국어</span>
        <span class="settings-item-arrow lang-check" aria-hidden="true"><i class="ti ti-check"></i></span>
      </div>

      <div class="settings-item" data-lang-option="en">
        <span class="settings-item-icon"><i class="ti ti-lang-en" aria-hidden="true"></i></span>
        <span class="settings-item-label">English</span>
        <span class="settings-item-arrow lang-check" aria-hidden="true"><i class="ti ti-check"></i></span>
      </div>

<div class="settings-title settings-title-spaced" data-i18n="backupSettings">백업 설정</div>
      <div class="settings-item" data-settings-menu="backup">
        <span class="settings-item-icon"><i class="ti ti-database-export"></i></span>
        <span class="settings-item-label" data-i18n="backup">백업 및 가져오기</span>
        <span class="settings-item-arrow"><i class="ti ti-chevron-right"></i></span>
      </div>
      <input type="file" id="backup-file-input" class="visually-hidden-file" accept=".json"/>
      <input type="file" id="excel-file-input" class="visually-hidden-file" accept=".xlsx,.xls"/>

    </div>
  </div>
</div>
<script src="./core.js"></script>
<script src="./lock.js"></script>
<script src="./settings.js"></script>
<script src="./router.js"></script>
<script src="./topbar.js"></script>
<script src="./pwa.js"></script>
<script src="./prayer.js"></script>
<script src="./category.js"></script>
<script src="./backup.js"></script>
<script src="./bootstrap.js"></script>

<script src="./debug-topbar.js"></script>  
</body></html>
